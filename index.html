<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="a page that serves as a reply to a task about cloning the design in an image with css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Image Clone</title>
  </head>
  <body>
    <main>
      <section class="containerBox">
        <div class="sedanBox">
          <figure class="imgBox">
            <img src="/html-css-assignment-2/images/icon-sedans.svg" alt="" />
          </figure>
          <h1>Sedans</h1>
          <p>
            Choose a Sedan for its affordability and excellent fuel economy.
            Ideal for cruising in the city or you next road trip
          </p>
        </div>
        <div class="suvBox">
          <figure class="imgBox">
            <img src="./html-css-assignment-2/images/icon-suvs.svg" alt="" />
          </figure>

          <h1>SUVs</h1>
        </div>
        <div class="luxuryBox">
          <figure class="imgBox">
            <img src="./html-css-assignment-2/images/icon-luxury.svg" alt="" />
          </figure>

          <h1>Luxury</h1>
        </div>
      </section>
    </main>
  </body>
</html>
